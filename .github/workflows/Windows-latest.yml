name: Windows

on: workflow_dispatch

permissions:
  actions: write

jobs:
  boot:
    runs-on: windows-latest

    steps:
    - name: Download bore
      run: |
        $api = Invoke-RestMethod "https://api.github.com/repos/ekzhang/bore/releases/latest"
        $url = ($api.assets | Where-Object { $_.name -match "windows" -and $_.name -match "\.zip" } | Select-Object -First 1).browser_download_url
        Invoke-WebRequest $url -OutFile bore.zip
        Expand-Archive bore.zip -DestinationPath .
    - name: Enable TS
      run: Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
    - run: Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
    - run: Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 1
    - run: Set-LocalUser -Name "runneradmin" -Password (ConvertTo-SecureString -AsPlainText "P@ssw0rd!" -Force)
    - name: Create Tunnel
      env:
        RUN_ID: ${{ github.run_id }}
        GH_TOKEN: ${{ github.token }}
      run: |
        Start-Process -NoNewWindow -FilePath ".\bore.exe" -ArgumentList "local","3389","--to","bore.pub" -RedirectStandardOutput bore.log -RedirectStandardError bore.err
        $addr = $null
        for ($i = 0; $i -lt 90; $i++) {
          if (Test-Path bore.log) {
            $m = Select-String -Path bore.log -Pattern 'listening at bore\.pub:(\d+)'
            if ($m) {
              $port = $m.Matches[0].Groups[1].Value
              $addr = "bore.pub:$port"
              gh variable set "BORE_$env:RUN_ID" --body "$addr" --repo ${{ github.repository }}
              break
            }
          }
          Start-Sleep -Seconds 2
        }
        Write-Host "Tunnel address: $addr"
        Wait-Process -Name bore
    - name: Cleanup variable
      if: always()
      env:
        RUN_ID: ${{ github.run_id }}
        GH_TOKEN: ${{ github.token }}
      run: |
        gh variable delete "BORE_$env:RUN_ID" --repo ${{ github.repository }} 2>$null || true
