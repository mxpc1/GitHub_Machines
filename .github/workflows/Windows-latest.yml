name: Windows

on: workflow_dispatch

jobs:
  boot:
    runs-on: windows-latest

    steps:
      - name: Download bore
        run: |
          # Try API first (to get the exact latest asset name)
          try {
            $api = Invoke-RestMethod "https://api.github.com/repos/ekzhang/bore/releases/latest"
            $asset = $api.assets | Where-Object { $_.name -match "windows" -and $_.name -match "\.zip" } | Select-Object -First 1
            $url = $asset.browser_download_url
            Write-Host "Using API: $url"
            Invoke-WebRequest $url -OutFile bore.zip
          } catch {
            Write-Host "API failed, using known direct URL..."
            # Fallback to the current known pattern
            Invoke-WebRequest "https://github.com/ekzhang/bore/releases/latest/download/bore-windows-x86_64.zip" -OutFile bore.zip
          }
          Expand-Archive bore.zip -DestinationPath .

      - name: Enable Remote Desktop
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1

      - name: Set RDP password
        run: Set-LocalUser -Name "runneradmin" -Password (ConvertTo-SecureString -AsPlainText "P@ssw0rd!" -Force)

      - name: Create tunnel to bore.pub:10238
        run: |
          # Resolve bore.pub using Google DNS (bypasses system DNS issues)
          $ip = (Resolve-DnsName bore.pub -Type A -Server 8.8.8.8 | Select-Object -First 1).IPAddress
          Write-Host "Resolved bore.pub to $ip"

          $tries = 0
          $maxTries = 3
          while ($tries -lt $maxTries) {
            $tries++
            Write-Host "Attempt $tries of $maxTries"
            .\bore.exe local 3389 --to "${ip}:10238"
            if ($LASTEXITCODE -eq 0) { 
              Write-Host "Tunnel established successfully!"
              break 
            }
            Write-Host "Tunnel failed, retrying in 5 seconds..."
            Start-Sleep -Seconds 5
          }
          if ($LASTEXITCODE -ne 0) { 
            Write-Error "Tunnel could not be established after $maxTries attempts."
            exit 1
          }
