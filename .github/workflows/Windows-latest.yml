name: Windows

on: workflow_dispatch

jobs:
  boot:
    runs-on: windows-latest

    steps:
    - name: Download bore
      run: |
        Invoke-WebRequest "https://github.com/ekzhang/bore/releases/latest/download/bore-windows.zip" -OutFile bore.zip
        Expand-Archive bore.zip -DestinationPath .

    - name: Enable Remote Desktop
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1

    - name: Set RDP password
      run: Set-LocalUser -Name "runneradmin" -Password (ConvertTo-SecureString -AsPlainText "P@ssw0rd!" -Force)

    - name: Create tunnel to bore.pub:10238
      run: |
        # Resolve bore.pub using Google DNS (bypasses system DNS issues)
        $ip = (Resolve-DnsName bore.pub -Type A -Server 8.8.8.8 | Select-Object -First 1).IPAddress
        Write-Host "Resolved bore.pub to $ip"

        # Try up to 3 times with the IP
        $tries = 0
        $maxTries = 3
        while ($tries -lt $maxTries) {
          $tries++
          Write-Host "Attempt $tries of $maxTries"
          .\bore.exe local 3389 --to "${ip}:10238"
          if ($LASTEXITCODE -eq 0) { break }
          Start-Sleep -Seconds 5
        }
