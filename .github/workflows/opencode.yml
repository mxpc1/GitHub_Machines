name: Persistent OpenCode Web
on:
  workflow_dispatch:

jobs:
  system:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
        with:
          persist-credentials: true

      - name: Update & install basics
        run: |
          sudo apt update
          sudo apt install -y screen git curl wget nodejs npm jq
          # Prevent git from ever falling back to an interactive credential
          # prompt (e.g. GCM trying to open a TTY during shutdown) — force
          # it to rely solely on the token already embedded in remote URLs.
          git config --global credential.helper ""
          git config --global core.askpass ""

      - name: Change password & hostname (optional)
        run: |
          echo -e "1234\n1234" | sudo passwd runner
          sudo hostnamectl set-hostname ammar0xff

      # ── PUBLIC project repo (this repo, may go public) ─────────────────
      # Only your actual project code lives here. Never anything sensitive.
      - name: Clone public project repo
        run: |
          cd $HOME
          git clone https://${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git repo
          cd repo
          DEFAULT_BRANCH=$(git remote show origin | grep 'HEAD branch' | cut -d' ' -f5)
          git checkout $DEFAULT_BRANCH
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Belt-and-braces: even if something ever writes here by mistake,
          # never let it get committed to the public repo.
          echo ".opencode/" >> .gitignore
          git add .gitignore
          git commit -m "Ignore .opencode in public repo" || true
          echo "✅ Public project dir: $HOME/repo"

      # ── PRIVATE data repo — THIS is the agent's primary workspace ──────
      # Anything the agent creates/reads by default lives here, at the
      # root of this repo. Requires secrets: PRIVATE_DATA_REPO
      # ("you/opencode-private-data") and PRIVATE_REPO_TOKEN (fine-grained
      # PAT scoped to that repo only).
      - name: Clone private data repo (primary workspace)
        run: |
          cd $HOME
          git clone https://${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/${{ secrets.PRIVATE_DATA_REPO }}.git private-data
          cd private-data
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p .opencode
          echo "✅ Private workspace (primary): $HOME/private-data"

      # Pull the public project in as a subfolder of the private workspace,
      # via symlink, so the agent can see/edit it too — but the private
      # repo's own git is told to ignore that subfolder entirely, since it
      # belongs to a different repo's history.
      - name: Link public project into private workspace
        run: |
          cd $HOME/private-data
          ln -s $HOME/repo public-project
          echo "public-project" >> .gitignore
          git add .gitignore
          git commit -m "Ignore public-project symlink in private repo" || true
          echo "✅ Agent working directory: $HOME/private-data (root = private repo)"
          echo "✅ Public project reachable at ./public-project/ — pushed only to the public repo"

      # Force OpenCode's real default storage path (~/.local/share/opencode)
      # to physically live inside the private repo, via symlink. This is
      # a belt-and-braces fix: OPENCODE_DATA_DIR appears to only partially
      # redirect storage (plugin data yes, the core session SQLite DB no),
      # so this guarantees the DB itself is captured regardless.
      - name: Redirect OpenCode's real storage path into private repo
        run: |
          mkdir -p $HOME/private-data/opencode-storage
          mkdir -p $HOME/.local/share
          rm -rf $HOME/.local/share/opencode
          ln -s $HOME/private-data/opencode-storage $HOME/.local/share/opencode
          echo "✅ ~/.local/share/opencode now points into the private repo"

      # /tmp/reports LOOKS like a normal folder under /tmp, but is actually
      # physically inside the private repo — so anything written there is
      # already part of the tracked tree, picked up by the same 15s backup
      # loop with zero extra "scanning" logic needed.
      - name: Redirect /tmp/reports into private repo
        run: |
          mkdir -p $HOME/private-data/reports
          rm -rf /tmp/reports
          ln -s $HOME/private-data/reports /tmp/reports
          echo "✅ /tmp/reports now points into the private repo — backed up every 15s"

      # OpenCode itself appears to use /tmp/opencode as a default working
      # dir for some outputs — redirect that one too, same technique.
      - name: Redirect /tmp/opencode into private repo
        run: |
          mkdir -p $HOME/private-data/tmp-opencode
          rm -rf /tmp/opencode
          ln -s $HOME/private-data/tmp-opencode /tmp/opencode
          echo "✅ /tmp/opencode now points into the private repo — backed up every 15s"

      - name: Install ngrok
        run: |
          sudo curl -sSL "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-linux-amd64.tgz" -o ngrok.tgz
          sudo tar -xzvf ngrok.tgz
          sudo rm ngrok.tgz
          sudo mv ngrok /usr/bin
          ngrok config add-authtoken ${{ secrets.NGROK_TOKEN }}

      - name: Install OpenCode
        run: |
          npm install -g opencode-ai

      # ── System prompt now lives IN the private repo, not a secret ──────
      # Edit $HOME/private-data/prompt.txt any time (even from inside the
      # OpenCode web UI itself). AGENTS.md is symlinked to it — OpenCode
      # auto-loads AGENTS.md from the project root and injects it into
      # EVERY agent's instructions by default, not just one you have to
      # manually select. First run creates a placeholder if missing.
      - name: Set default system prompt from private repo file (AGENTS.md)
        run: |
          cd $HOME/private-data
          if [ ! -f prompt.txt ]; then
            cat > prompt.txt << 'EOF'
          # Security Agent

          You are a cybersecurity-focused assistant. Introduce yourself as
          such when asked who you are. Focus on security in all code
          reviews and implementations.

          ## Guidelines
          - Check for common vulnerabilities (SQLi, XSS, auth flaws, etc.)
          - Validate all user inputs
          - Flag insecure defaults and misconfigurations
          - Never include real secrets/credentials in output
          EOF
            git add prompt.txt
            git commit -m "Add default security agent prompt" || true
            echo "ℹ️ prompt.txt did not exist — created a default. Edit it any time in the private repo."
          fi
          # Symlink so AGENTS.md always mirrors whatever prompt.txt says —
          # no separate copy step needed, no restart required for edits.
          ln -sf prompt.txt AGENTS.md
          git add AGENTS.md

          # Also register it as a SELECTABLE custom agent ("security" in the
          # Build/Plan/security dropdown), stored inside the tracked repo
          # (.opencode/agent/) so it persists across restarts on its own —
          # no need to regenerate from a secret or global config each run.
          mkdir -p .opencode/agent
          ln -sf ../../prompt.txt .opencode/agent/security.md
          git add .opencode/agent/security.md

          git commit -m "Link AGENTS.md and security agent to prompt.txt" || true
          echo "✅ Default instructions active via AGENTS.md, and 'security' agent selectable in the UI"

      - name: Start OpenCode Web (with verification)
        run: |
          cd $HOME/private-data
          export OPENCODE_DATA_DIR=$HOME/private-data/.opencode

          # Launch inside screen so it survives, logging to a file we can inspect
          screen -dmS opencode bash -c "cd $HOME/private-data && OPENCODE_DATA_DIR=$HOME/private-data/.opencode opencode web --hostname 0.0.0.0 --port 3000 2>&1 | tee /tmp/opencode.log"

          # Actively wait for it to respond instead of a blind sleep
          echo "⏳ Waiting for OpenCode Web to come up on port 3000..."
          for i in $(seq 1 30); do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:3000 | grep -qE "200|301|302"; then
              echo "✅ OpenCode Web is responding on port 3000"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "❌ OpenCode Web did not start in time. Log output:"
              cat /tmp/opencode.log || true
              exit 1
            fi
            sleep 2
          done

      - name: Keep OpenCode Web alive (auto-restart watchdog)
        run: |
          cd $HOME/private-data
          nohup bash -c '
            while true; do
              if ! curl -s -o /dev/null http://localhost:3000; then
                echo "⚠️ OpenCode Web not responding, restarting..."
                screen -S opencode -X quit || true
                screen -dmS opencode bash -c "cd $HOME/private-data && OPENCODE_DATA_DIR=$HOME/private-data/.opencode opencode web --hostname 0.0.0.0 --port 3000 2>&1 | tee -a /tmp/opencode.log"
              fi
              sleep 15
            done
          ' > /tmp/watchdog.log 2>&1 &
          echo "✅ Watchdog started to keep OpenCode Web alive"

      - name: Expose OpenCode Web via ngrok (single tunnel)
        run: |
          nohup ngrok http 3000 --log=stdout > /tmp/ngrok-opencode.log 2>&1 &
          sleep 5
          OPENCODE_URL=$(curl -s http://localhost:4040/api/tunnels | jq -r '.tunnels[0].public_url')
          echo "🔗 OpenCode Web URL: $OPENCODE_URL"
          echo "✅ Open this URL directly — it goes straight to the OpenCode Web UI, no terminal typing needed."

      # ── Backup helpers: two independent repos, two independent pushes ──
      - name: Set up backup helper scripts
        run: |
          cat > /tmp/backup-public.sh << 'EOF'
          #!/bin/bash
          cd $HOME/repo
          # Stage + commit any local changes first (so a pull can rebase cleanly)
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "Auto-backup $(date +'%Y-%m-%d %H:%M:%S')"
          fi
          # Always pull, so edits made directly on GitHub show up here too
          git pull --rebase origin HEAD --autostash 2>&1 | tail -3
          # Push only if we actually have local commits ahead of origin
          if [ -n "$(git log origin/HEAD..HEAD 2>/dev/null)" ]; then
            if git push origin HEAD; then
              echo "✅ Public backup pushed"
            else
              echo "❌ Public push FAILED — check auth/permissions"
            fi
          else
            echo "ℹ️ No public changes to push"
          fi
          EOF
          chmod +x /tmp/backup-public.sh

          cat > /tmp/backup-private.sh << 'EOF'
          #!/bin/bash
          cd $HOME/private-data
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "Auto-backup $(date +'%Y-%m-%d %H:%M:%S')"
          fi
          git pull --rebase origin HEAD --autostash 2>&1 | tail -3
          if [ -n "$(git log origin/HEAD..HEAD 2>/dev/null)" ]; then
            if git push origin HEAD; then
              echo "✅ Private backup pushed"
            else
              echo "❌ Private push FAILED — check auth/permissions"
            fi
          else
            echo "ℹ️ No private changes to push"
          fi
          EOF
          chmod +x /tmp/backup-private.sh

          cat > /tmp/backup-all.sh << 'EOF'
          #!/bin/bash
          /tmp/backup-public.sh
          /tmp/backup-private.sh
          EOF
          chmod +x /tmp/backup-all.sh

      - name: Periodic Git backup (every 15s, both repos)
        run: |
          while true; do
            sleep 15
            echo "⏳ Backing up changes..."
            /tmp/backup-all.sh
          done &
          echo $! > /tmp/backup-loop.pid

      - name: Keep alive (with final backup on shutdown)
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🔗 Check the OpenCode URL printed above."
          echo "🔒 Agent root (default) → private repo, backed up every 15s"
          echo "📂 ./public-project/    → public repo, backed up every 15s"
          echo "🔒 prompt.txt           → private repo, backed up every 15s"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          finalize() {
            echo "🛑 Caught shutdown signal — running final backup before exit..."
            /tmp/backup-all.sh
            if [ -f /tmp/backup-loop.pid ]; then
              kill "$(cat /tmp/backup-loop.pid)" 2>/dev/null || true
            fi
            echo "✅ Final backup complete. Exiting."
            exit 0
          }
          trap finalize SIGTERM SIGINT

          while true; do
            sleep 5 &
            wait $!
          done
