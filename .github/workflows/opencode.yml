name: Persistent OpenCode Web
on:
  workflow_dispatch:

jobs:
  system:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
        with:
          persist-credentials: true

      - name: Update & install basics
        run: |
          sudo apt update
          sudo apt install -y screen git curl wget nodejs npm jq

      - name: Change password & hostname (optional)
        run: |
          echo -e "1234\n1234" | sudo passwd runner
          sudo hostnamectl set-hostname ammar0xff

      - name: Clone repo for persistence
        run: |
          cd /tmp
          git clone https://${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git repo
          cd repo
          DEFAULT_BRANCH=$(git remote show origin | grep 'HEAD branch' | cut -d' ' -f5)
          git checkout $DEFAULT_BRANCH
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p .opencode
          echo "✅ Work directory: /tmp/repo"

      - name: Install ngrok
        run: |
          sudo curl -sSL "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-linux-amd64.tgz" -o ngrok.tgz
          sudo tar -xzvf ngrok.tgz
          sudo rm ngrok.tgz
          sudo mv ngrok /usr/bin
          ngrok config add-authtoken ${{ secrets.NGROK_TOKEN }}

      - name: Install OpenCode
        run: |
          npm install -g opencode-ai

      - name: Start OpenCode Web (with verification)
        run: |
          cd /tmp/repo
          export OPENCODE_DATA_DIR=/tmp/repo/.opencode

          # Launch inside screen so it survives, logging to a file we can inspect
          screen -dmS opencode bash -c "cd /tmp/repo && OPENCODE_DATA_DIR=/tmp/repo/.opencode opencode web --hostname 0.0.0.0 --port 3000 2>&1 | tee /tmp/opencode.log"

          # Actively wait for it to respond instead of a blind sleep
          echo "⏳ Waiting for OpenCode Web to come up on port 3000..."
          for i in $(seq 1 30); do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:3000 | grep -qE "200|301|302"; then
              echo "✅ OpenCode Web is responding on port 3000"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "❌ OpenCode Web did not start in time. Log output:"
              cat /tmp/opencode.log || true
              exit 1
            fi
            sleep 2
          done

      - name: Keep OpenCode Web alive (auto-restart watchdog)
        run: |
          cd /tmp/repo
          nohup bash -c '
            while true; do
              if ! curl -s -o /dev/null http://localhost:3000; then
                echo "⚠️ OpenCode Web not responding, restarting..."
                screen -S opencode -X quit || true
                screen -dmS opencode bash -c "cd /tmp/repo && OPENCODE_DATA_DIR=/tmp/repo/.opencode opencode web --hostname 0.0.0.0 --port 3000 2>&1 | tee -a /tmp/opencode.log"
              fi
              sleep 15
            done
          ' > /tmp/watchdog.log 2>&1 &
          echo "✅ Watchdog started to keep OpenCode Web alive"

      - name: Expose OpenCode Web via ngrok (single tunnel)
        run: |
          nohup ngrok http 3000 --log=stdout > /tmp/ngrok-opencode.log 2>&1 &
          sleep 5
          OPENCODE_URL=$(curl -s http://localhost:4040/api/tunnels | jq -r '.tunnels[0].public_url')
          echo "🔗 OpenCode Web URL: $OPENCODE_URL"
          echo "✅ Open this URL directly — it goes straight to the OpenCode Web UI, no terminal typing needed."

      - name: Set up backup helper script
        run: |
          cat > /tmp/backup.sh << 'EOF'
          #!/bin/bash
          cd /tmp/repo
          git add -A
          if git diff --staged --quiet; then
            echo "ℹ️ No changes"
          else
            git commit -m "Auto-backup $(date +'%Y-%m-%d %H:%M:%S')"
            git push origin HEAD
            echo "✅ Backup pushed"
          fi
          EOF
          chmod +x /tmp/backup.sh

      - name: Periodic Git backup (every 60s)
        run: |
          while true; do
            sleep 60
            echo "⏳ Backing up changes..."
            /tmp/backup.sh
          done &
          echo $! > /tmp/backup-loop.pid

      - name: Keep alive (with final backup on shutdown)
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🔗 Check the OpenCode URL printed above."
          echo "📂 All data stored in /tmp/repo and backed up every 60s"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          finalize() {
            echo "🛑 Caught shutdown signal — running final backup before exit..."
            /tmp/backup.sh
            # Also stop the periodic loop cleanly so it doesn't race the final push
            if [ -f /tmp/backup-loop.pid ]; then
              kill "$(cat /tmp/backup-loop.pid)" 2>/dev/null || true
            fi
            echo "✅ Final backup complete. Exiting."
            exit 0
          }
          trap finalize SIGTERM SIGINT

          # Wait in a loop (instead of a plain blocking command) so the trap
          # can actually interrupt and run when a signal arrives.
          while true; do
            sleep 5 &
            wait $!
          done
